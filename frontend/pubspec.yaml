name: heart_feedback
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  camera: ^0.11.0+2
  # Earlier iOS implementations initialized microphone capture with audio disabled.
  camera_avfoundation: ^0.9.22+1
  audioplayers: ^6.1.0
  http: ^1.2.2
  intl: ^0.20.2
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  wakelock_plus: ^1.2.8
  flutter_volume_controller: ^1.3.3
  sound_mode: ^3.1.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^4.1.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  ffigen: ^9.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo_app_icon.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/logo_app_icon.png
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true
  assets:
  - assets/beep.mp3
  - assets/voice/
  - assets/history_icon.png
  - assets/profile_icon.png
  - assets/pulse.png
  - assets/logo_monitor_mark.png
  - assets/logo_app_icon.png
  - assets/logo_monitor_app.png
  - assets/icons/user.svg
  - assets/icons/camera.svg
  - assets/icons/fingerprint.svg
  - assets/icons/timer.svg
  - assets/heart0.png
  - assets/heart1.png
  - assets/heart2.png
  - assets/heart3.png
  - assets/heart4.png
  - assets/heart5.png
  - assets/score_image.png
  - assets/step1.png
  - assets/step2.png
  - assets/step3.png
  - assets/step4.png
